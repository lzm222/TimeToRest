plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom-remap'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${project.name}"
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir(project(":data").file("src/generated/resources"))
    srcDir(project(":data").file("src/main/resources"))

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache") // datagen cache files
}

repositories {
    maven { url "https://maven.aliyun.com/repository/public/" }
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
    maven { url 'https://repository.hanbings.io/proxy' }
    maven { url 'https://maven.parchmentmc.org' }
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            // sourceSet project(":common").sourceSets.main
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation project(":common")
}

processResources {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
}

tasks.named('compileJava', JavaCompile) {
    source project(":common").file('src/main')
}

sourcesJar {
    from project(":common").file('src/main/java')
}
